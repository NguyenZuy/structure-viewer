<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <meta name="description" content="Interactive 3D viewer for a timber-framed house: select, isolate, measure and take off materials. Unity WebGL, desktop and mobile.">
    <meta name="theme-color" content="#1E1F22">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231E1F22'/%3E%3Cpath d='M4 12 12 5l8 7M6.5 10v9h11v-9' fill='none' stroke='%23FF8A1F' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <script>
      // Build/ paths are relative: /structure-viewer must become /structure-viewer/ or they resolve against the site root.
      if (!/\/$|\.html?$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search + location.hash);
    </script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1E1F22; }
      /* touch-action: none keeps the browser from scrolling/zooming the page while orbiting or pinching. */
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #1E1F22; touch-action: none; outline: none; }

      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                         max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
                box-sizing: border-box; background: radial-gradient(ellipse at 50% 40%, #2A2C31 0%, #1E1F22 70%);
                font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #9A9CA3; text-align: center;
                transition: opacity 0.4s ease; }
      #splash.done { opacity: 0; pointer-events: none; }
      h1 { margin: 0 0 24px; font-size: clamp(28px, 6vw, 44px); font-weight: 700; color: #ECEDEF; letter-spacing: -0.01em; }
      #bar { width: min(72vw, 320px); height: 4px; border-radius: 2px; background: #35373C; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #FF8A1F; transition: width 0.2s; }
      #status { margin-top: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
      #error { display: none; max-width: 440px; margin-top: 16px; color: #E5484D; }
      #error small { display: block; margin-top: 6px; color: #7C7F87; word-break: break-word; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="splash">
      <h1>{{{ PRODUCT_NAME }}}</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="status">Loading…</div>
      <div id="error"></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      // Phones report devicePixelRatio 3+; rendering at full DPR costs far more fill rate than it adds detail.
      // ?dpr=1.5 overrides the cap for performance testing.
      var dprParam = parseFloat(new URLSearchParams(location.search).get("dpr"));
      var dpr = isFinite(dprParam) && dprParam > 0 ? dprParam : Math.min(window.devicePixelRatio || 1, 2);

      var splash = document.getElementById("splash");
      var fill = document.getElementById("fill");
      // Not "status": a global var of that name is window.status, which only holds strings.
      var statusText = document.getElementById("status");
      createUnityInstance(document.getElementById("unity-canvas"), {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: dpr,
        autoSyncPersistentDataPath: true,
      }, function (progress) {
        // The loader reports downloads up to 0.9; the rest is engine start-up.
        fill.style.width = (progress * 100) + "%";
        statusText.textContent = progress < 0.9 ? "Downloading… " + Math.round(progress / 0.9 * 100) + "%" : "Starting…";
      }).then(function () {
        splash.classList.add("done");
        setTimeout(function () { splash.remove(); }, 450);
      }).catch(function (message) {
        document.getElementById("bar").style.display = "none";
        statusText.style.display = "none";
        var error = document.getElementById("error");
        error.style.display = "block";
        error.textContent = "The viewer couldn't start. It needs WebGL 2: a recent Chrome, Edge, Firefox, or Safari 15+.";
        var detail = document.createElement("small");
        detail.textContent = String(message);
        error.appendChild(detail);
      });
    </script>
  </body>
</html>
